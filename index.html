  dxSel(el){ panelState.dxSel = el.dataset.id; dxEdit = null; rerenderMain(); },
  pkRm(el){ dxEdit.mats.splice(+el.dataset.i, 1); rerenderMain(); },
  pkUp(el){ const i = +el.dataset.i; if (i > 0) { [dxEdit.mats[i - 1], dxEdit.mats[i]] = [dxEdit.mats[i], dxEdit.mats[i - 1]]; rerenderMain(); } },
  pkSave(){ const d = S.dx.find(x => x.id === dxEdit.id); d.mats = dxEdit.mats.slice(); save(); rerenderMain(); toast('Pacote "' + d.nome + '" salvo.', {icon:'check'}); },
  pkReset(){ dxEdit = null; rerenderMain(); },
  rowToggle(el){
    const pid = el.dataset.pid, isOpen = el.getAttribute('aria-expanded') === 'true';
    let closedAbove = false;
    $$('.prow[aria-expanded="true"]').forEach(b => { if (b !== el) { if (b.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) closedAbove = true; closeRow(b.dataset.pid); } });
    if (isOpen) { closeRow(pid); history.replaceState(null, '', '#/painel/pacientes'); }
    else { openRow(pid); history.replaceState(null, '', '#/painel/pacientes/' + pid); scrollRowIntoView(pid, closedAbove ? 320 : 90); }
  },
  rsEdit(el){ const p = pat(el.dataset.pid), box = $('#rs-' + p.id); box.innerHTML = resumoHTML(p, true); $$('textarea', box).forEach(autoGrow); $('textarea', box).focus(); },
  rsCancel(el){ const p = pat(el.dataset.pid); $('#rs-' + p.id).innerHTML = resumoHTML(p, false); },
  rsSave(el){ const p = pat(el.dataset.pid), box = $('#rs-' + p.id), data = {}; RS_F.forEach(([k]) => data[k] = $('#rs-' + p.id + '-' + k).value); saveResumo(p, data); box.innerHTML = resumoHTML(p, false); toast(p.resumo ? 'Resumo de ' + p.curto + ' atualizado.' : 'Resumo apagado.', {icon:'check'}); const b = $('[data-act="rsEdit"]', box); b && b.focus(); },
  newPatient(){ pModal(`<div class="pm-h"><div><span class="card-t">Pacientes</span><h2 id="npT">Cadastrar criança</h2></div><button class="icon-btn" data-pm="x" aria-label="Fechar">${ic('x')}</button></div><div class="pm-b">${cadHTML(false)}</div>`, 'npT'); setTimeout(() => $('#cdNome').focus(), 80); },
  cadSave(el){
    const nome = $('#cdNome').value.trim().replace(/\s+/g, ' '), nasc = $('#cdNasc').value, resp = $('#cdResp').value.trim();
    const err = !nome ? 'Escreva o nome da criança.' : !nasc ? 'Informe a data de nascimento.' : nasc > ymd(new Date()) ? 'A data de nascimento não pode estar no futuro.' : !resp ? 'Escreva o nome do responsável.' : '';
    if (err) { $('#cdErr').textContent = err; return; }
    const p = createPatient(nome, nasc, resp);
    toast('Cadastro de ' + p.curto + ' criado.', {icon:'check'});
    if (el.dataset.from === 'ap') { Object.assign(apDraft, {pid:p.id, resp:p.resp, mode:'form', err:{}, q:''}); apRender(); }
    else { closePm(); panelState.q = ''; go('/painel/pacientes/' + p.id); }
  },
  apBack(){ apDraft.mode = 'form'; apRender('#apQ'); },
  newAp(el){ closePm(); openApForm({pid: el.dataset.pid, data: el.dataset.date}); },
  apPick(el){ const p = pat(el.dataset.pid); Object.assign(apDraft, {pid:p.id, resp:p.resp, q:'', conflict:null, keep:false}); delete apDraft.err.pid; apRender('[data-act="apChange"]'); },
  apChange(){ Object.assign(apDraft, {pid:null, q:'', conflict:null, keep:false}); apRender('#apQ'); },
  apCad(){ apDraft.mode = 'cad'; apRender('#cdNome'); },
  apSet(el){ const f = el.dataset.f, v = el.dataset.v; apDraft[f] = v; if (f === 'hora') delete apDraft.err.hora; apDraft.conflict = null; apDraft.keep = false; apRender(`.optb[data-f="${f}"][data-v="${v}"]`); },
  apSlot(el){ apDraft.hora = el.dataset.v; apDraft.conflict = null; apDraft.keep = false; apRender('[data-act="apSave"]'); },
  apKeep(){ apDraft.keep = true; $('#apConf').innerHTML = confHTML(); $('#apFoot').innerHTML = apFootHTML(); $('#apFoot .btn').focus(); },
  apSave(el){
    const a = apDraft; a.err = {};
    if (!a.pid) a.err.pid = 1;
    if (!a.hora) a.err.hora = 1;
    if (Object.keys(a.err).length) return apRender();
    const novo = {id:'ag' + Date.now(), pid:a.pid, resp:(a.resp || '').trim() || null, data:a.data, hora:a.hora, mod:a.mod, tipo:a.tipo};
    const cs = conflicts(novo);
    if (cs.length && !el.dataset.force) { a.conflict = {list:cs, free:freeSlots(novo)}; a.keep = false; $('#apConf').innerHTML = confHTML(); $('#apFoot').innerHTML = apFootHTML(); $('#apConf .conf').scrollIntoView({block:'nearest'}); return; }
    S.ag.push(novo); save(); closePm(); afterApSaved(novo);
  },
  apGoPat(el){ closePm(); go('/painel/pacientes/' + el.dataset.pid); },
  agMove(el){ const d = +el.dataset.d; if (!d) { const n = new Date(); panelState.agM = [n.getFullYear(), n.getMonth()]; } else { const [Y, M] = curMonth(); const x = new Date(Y, M + d, 1); panelState.agM = [x.getFullYear(), x.getMonth()]; } rerenderMain(); },
  agView(el){ panelState.agView = el.dataset.v; rerenderMain(); },
  agDay(el){ dayBox(el.dataset.date, el.dataset.mod); }
};
const inp = {
  famSwitch(el){ const p = pat(el.value); S.famPid = p.id; save(); go('/familia/' + p.id + '/' + (p.desbloqueado ? 'inicio' : 'pin')); },
  libq(el){ famState.q = el.value; const p = pat(S.famPid); const box = document.createElement('div'); box.innerHTML = fBiblioteca(p); $('#libList').innerHTML = $('#libList', box).innerHTML; $$('.chips .chip').forEach(c => c.setAttribute('aria-pressed', String(!famState.q && c.dataset.t === famState.tema))); },
  pq(el){ panelState.q = el.value; const q = norm(el.value); const list = S.pacientes.filter(p => !q || norm(p.nome + ' ' + p.resp).includes(q)); const o = $('.prow[aria-expanded="true"]'); $('#ptable').innerHTML = ptableHTML(list, o ? o.dataset.pid : null); },
  libQ(el){ panelState.libQ = el.value; const box = document.createElement('div'); box.innerHTML = pBiblioteca(); $('#libTable').innerHTML = $('#libTable', box).innerHTML; },
  meas(el){ draft[el.dataset.k] = el.value; validateMeas(el.dataset.k, true); refreshPreview(); },
  prem(el){ draft.prem = el.checked; },
  mat(el){ const id = el.dataset.id; if (el.checked) { if (!draft.mats.includes(id)) draft.mats.push(id); } else draft.mats = draft.mats.filter(x => x !== id); const c = $('#mCount'); if (c) c.textContent = draft.mats.length; refreshPreview(); },
  addMat(el){ if (!el.value) return; draft.mats.push(el.value); $('#pkgBox').innerHTML = pkgBox(); refreshPreview(); },
  nota(el){ draft.nota = el.value; refreshPreview(); },
  docTipo(el){ draft.doc.tipo = el.value; refreshPreview(); },
  file(el){ const f = el.files[0]; if (f) setDoc(f.name, false); },
  waMsg(el){ S.lastPub.msg = el.value; save(); },
  pkAdd(el){ if (!el.value) return; dxEdit.mats.push(el.value); rerenderMain(); },
  dxText(el){ setDx(el.value); },
  faqq(el){ famState.faqQ = el.value; famState.faqOpen = null; $('#faqList').innerHTML = faqHTML(); },
  apQ(el){ apDraft.q = el.value; $('#apSug').innerHTML = apSugHTML(); },
  apResp(el){ apDraft.resp = el.value; },
  apData(el){ if (el.value) { apDraft.data = el.value; apSoft(); } },
  apHora(el){ apDraft.hora = el.value; delete apDraft.err.hora; apSoft(); },
  grow(el){ autoGrow(el); }
};
function copy(text, msg){
  const done = () => toast(msg, {icon:'check'});
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){ const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Não foi possível copiar.', {icon:'alert'}); } t.remove(); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) { act[a.dataset.act] && act[a.dataset.act](a, e); }
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) { e.preventDefault(); go(g.dataset.go); }
});
document.addEventListener('input', e => { const t = e.target.closest('[data-in]'); if (t && inp[t.dataset.in] && t.tagName !== 'SELECT' && t.type !== 'checkbox' && t.type !== 'file') inp[t.dataset.in](t); });
document.addEventListener('change', e => { const t = e.target.closest('[data-in]'); if (t && inp[t.dataset.in] && (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file')) inp[t.dataset.in](t); });
document.addEventListener('focusout', e => { const t = e.target.closest('[data-in="meas"]'); if (t) validateMeas(t.dataset.k); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = $('.modal-bg') || $('.sheet-bg') || $('.drawer-bg') || $('.pmodal-bg'); if (m) m.remove(); } });

/* =========================================================
   COMENTÁRIOS DA CLIENTE — acumula no aparelho e envia 1 e-mail
   (Web3Forms). Cole a chave pública em FB_ACCESS_KEY.
   ========================================================= */
const FB_ACCESS_KEY = 'COLE_AQUI_A_CHAVE_DO_WEB3FORMS';
const FB_STORE = 'larissa-demo-feedback-v1';   // separado do KEY: "Reiniciar demonstração" não apaga comentários
const FB_TIPOS = ['Quero diferente','Não gostei','Ideia','Gostei'];
let FB = (() => { try { const v = JSON.parse(localStorage.getItem(FB_STORE)); if (v && Array.isArray(v.items)) return v; } catch(e){} return {items:[], draft:'', tipo:'Quero diferente', nome:''}; })();
const fbSave = () => { try { localStorage.setItem(FB_STORE, JSON.stringify(FB)); } catch(e){} };
function fbWhere(){
  const s = parse();
  const modo = s[0] === 'painel' ? 'Médica' : s[0] === 'familia' ? 'Família' : 'Início';
  const h = $('#app h1') || $('#app h2');
  const titulo = h ? h.textContent.replace(/\s+/g, ' ').trim().slice(0, 60) : '';
  return {modo, titulo, rota: '#/' + s.join('/'), label: modo + (titulo ? ' › ' + titulo : '')};
}
function fbCount(){ const b = $('#fbBtn'); if (b) { b.dataset.n = String(FB.items.length); $('#fbN').textContent = FB.items.length; } }
function fbText(){
  const L = [`Feedback da demo — ${FB.items.length} comentário(s)`,
    `De: ${FB.nome || 'Dra. Larissa'}`,
    `Aparelho: ${innerWidth}x${innerHeight} · ${navigator.userAgent.slice(0, 90)}`, ''];
  FB.items.forEach((c, i) => L.push(`${i + 1}) [${c.tipo}] ${c.label}`, `   Rota: ${c.rota} · ${new Date(c.at).toLocaleString('pt-BR')}`, `   ${c.txt.replace(/\n/g, '\n   ')}`, ''));
  return L.join('\n');
}
function fbListHtml(){
  if (!FB.items.length) return '<p class="fb-empty">Nenhum comentário ainda.</p>';
  return FB.items.map(c => `<div class="fb-item"><div class="tx"><span class="tg">${esc(c.tipo)} · ${esc(c.label)}</span><p>${esc(c.txt)}</p></div><button type="button" data-fb-del="${c.id}" aria-label="Apagar comentário">${ic('trash')}</button></div>`).join('');
}
function fbSendHtml(err){
  const n = FB.items.length;
  return (err ? `<div class="fb-err" role="alert">${esc(err)}</div>` : '') +
    `<div class="field"><label for="fbNome">Seu nome (opcional)</label><input class="input" id="fbNome" value="${esc(FB.nome)}" autocomplete="name"></div>` +
    `<button type="button" class="btn btn-1" id="fbEnviar" ${n ? '' : 'disabled'}>${ic('send')}Enviar ${n ? n + (n === 1 ? ' comentário' : ' comentários') : 'comentários'}</button>` +
    (n ? `<button type="button" class="btn btn-ghost" id="fbCopiar">Copiar comentários</button>` : '');
}
function fbClose(){ const d = $('#fbDrawer'); if (d) d.remove(); }
function fbOpen(){
  if ($('#fbDrawer')) return fbClose();
  const bg = document.createElement('div');
  bg.className = 'drawer-bg'; bg.id = 'fbDrawer';
  const w = fbWhere();
  bg.innerHTML = `<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="fbT">
    <div class="drawer-h"><h2 id="fbT" style="font-size:18px">Comentários</h2><button type="button" class="btn btn-ghost" data-fb-x aria-label="Fechar">${ic('x')}</button></div>
    <div class="fb-body">
      <p class="fb-note">Conforme for usando, anote o que gostou, o que não gostou ou o que quer diferente. Nada é enviado até você tocar em <b>Enviar</b>.</p>
      <p class="fb-warn">Não escreva nomes nem dados de pacientes reais.</p>
      <div class="fb-where">Comentando sobre: <b>${esc(w.label)}</b></div>
      <div class="chips" role="group" aria-label="Tipo de comentário" id="fbTipos">${FB_TIPOS.map(t => `<button type="button" class="chip" data-fb-tipo="${t}" aria-pressed="${t === FB.tipo}">${t}</button>`).join('')}</div>
      <div class="field"><label for="fbTxt">O que você achou?</label><textarea class="input" id="fbTxt" rows="4" placeholder="Ex.: o gráfico de peso podia ter a linha da média mais clara">${esc(FB.draft)}</textarea></div>
      <button type="button" class="btn btn-2" id="fbAdd">${ic('plus')}Adicionar comentário</button>
      <div class="fb-list" id="fbList" aria-live="polite">${fbListHtml()}</div>
      <div class="fb-send" id="fbSend">${fbSendHtml()}</div>
    </div></aside>`;
  bg.addEventListener('click', async e => {
    if (e.target === bg || e.target.closest('[data-fb-x]')) return fbClose();
    const t = e.target.closest('[data-fb-tipo]');
    if (t) { FB.tipo = t.dataset.fbTipo; fbSave(); $$('#fbTipos .chip').forEach(c => c.setAttribute('aria-pressed', String(c === t))); return; }
    const d = e.target.closest('[data-fb-del]');
    if (d) { FB.items = FB.items.filter(c => String(c.id) !== d.dataset.fbDel); fbSave(); fbCount(); $('#fbList').innerHTML = fbListHtml(); $('#fbSend').innerHTML = fbSendHtml(); return; }
    if (e.target.closest('#fbAdd')) {
      const txt = $('#fbTxt').value.trim();
      if (!txt) { $('#fbTxt').focus(); return toast('Escreva o comentário antes de adicionar.', {icon:'info'}); }
      const w2 = fbWhere();
      FB.items.push({id: Date.now(), tipo: FB.tipo, txt, at: new Date().toISOString(), label: w2.label, rota: w2.rota});
      FB.draft = ''; $('#fbTxt').value = ''; fbSave(); fbCount();
      $('#fbList').innerHTML = fbListHtml(); $('#fbSend').innerHTML = fbSendHtml();
      return toast('Comentário anotado.', {icon:'check'});
    }
    if (e.target.closest('#fbCopiar')) return copy(fbText(), 'Comentários copiados.');
    if (e.target.closest('#fbEnviar')) {
      const btn = $('#fbEnviar');
      if (FB_ACCESS_KEY.startsWith('COLE_AQUI')) { $('#fbSend').innerHTML = fbSendHtml('O envio ainda não foi configurado. Use "Copiar comentários" e mande para o Edu.'); return; }
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        const r = await fetch('https://api.web3forms.com/submit', {method:'POST', headers:{'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify({access_key: FB_ACCESS_KEY, subject: `Feedback da demo — ${FB.items.length} comentário(s)`, from_name: 'Demo Dra. Larissa', name: FB.nome || 'Dra. Larissa', message: fbText()})});
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.success === false) throw new Error(j.message || 'falha');
        FB.items = []; FB.draft = ''; fbSave(); fbCount(); fbClose();
        toast('Comentários enviados. Obrigado!', {bear:true, ms:4000});
      } catch(err) {
        $('#fbSend').innerHTML = fbSendHtml('Não consegui enviar agora. Seus comentários continuam salvos aqui; tente de novo ou use "Copiar comentários".');
      }
    }
  });
  bg.addEventListener('input', e => {
    if (e.target.id === 'fbTxt') { FB.draft = e.target.value; fbSave(); }
    if (e.target.id === 'fbNome') { FB.nome = e.target.value; fbSave(); }
  });
  document.body.appendChild(bg);
  $('#fbTxt').focus();
}
act.fb = fbOpen;
fbCount();

render();
</script>
</body>
</html>
