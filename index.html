<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App da Dra. Larissa · Demonstração</title>
<meta name="description" content="Demonstração do app de acompanhamento pediátrico da Dra. Larissa Alvim Werner. Conteúdo ilustrativo.">
<meta name="theme-color" content="#4E548E">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS — troque aqui para aplicar o projeto gráfico final
   ========================================================= */
:root{
  /* Paleta oficial (10 cores) */
  --c-lilac:#8182B8; --c-lavender:#929BC7;
  --c-green:#72B493; --c-green-p:#A6CCB2;
  --c-blue:#93C9E4;  --c-blue-p:#A6CBE7;
  --c-yellow:#F6D57A; --c-yellow-p:#F7E2A3;
  --c-terra:#CC9269; --c-peach:#D5A67E;
  /* Variações funcionais (contraste) */
  --c-deep:#4E548E; --c-deep-h:#424880;
  --c-green-d:#2F6B4F; --c-blue-d:#245F80; --c-yellow-d:#7A5C0E; --c-peach-d:#86502A;
  /* Tints de superfície */
  --t-lilac:#EEEFF8; --t-green:#E7F3EC; --t-blue:#E5F1F9; --t-yellow:#FCF3D7; --t-peach:#F8ECE2;
  /* Neutros */
  --bg:#F8FAFD; --surface:#FFFFFF; --bg-alt:#F1F4F9; --text:#243047; --text-2:#5A6479; --muted:#8A93A6; --border:#E8ECF2;
  /* Semânticas (distintas das decorativas) */
  --ok-t:#2D6A4F; --ok-b:#E3F2E9; --warn-t:#6B5313; --warn-b:#FCF1CF; --err-t:#A3312A; --err-b:#FCEBEA; --err:#C2453D;
  /* Tipografia */
  --font:'Plus Jakarta Sans','Nunito Sans','DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* Raios */
  --r-xs:10px; --r-sm:14px; --r-md:18px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
  /* Sombras */
  --sh-1:0 1px 2px rgba(36,48,71,.04),0 6px 18px rgba(36,48,71,.06);
  --sh-2:0 2px 8px rgba(36,48,71,.06),0 18px 40px rgba(36,48,71,.10);
  --sh-phone:0 30px 80px rgba(78,84,142,.22),0 8px 24px rgba(36,48,71,.10);
  /* Movimento */
  --ease:cubic-bezier(.22,.8,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --demobar:52px;
  /* Modalidades da agenda (cor + ícone + rótulo) */
  --m-on:#C2558A; --m-on-t:#8E2F5E; --m-on-b:#FBE7F0;
  --m-co:#3E8DBA; --m-co-t:#245F80; --m-co-b:#E1EFF8;
  --m-do:#D9A520; --m-do-t:#6B5313; --m-do-b:#FCF1CF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:var(--demobar)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--c-deep)}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c-lilac);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}
svg.i.l{width:26px;height:26px}

/* ---------- Barra da demonstração ---------- */
.demobar{position:fixed;inset:0 0 auto 0;height:var(--demobar);z-index:80;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.demobar .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-deep);background:var(--t-lilac);padding:5px 10px;border-radius:var(--r-pill)}
.demobar .tag .dot{width:7px;height:7px;border-radius:50%;background:var(--c-lilac);animation:pulse 2.4s infinite}
.demobar .home{border:0;background:none;padding:6px;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:14px;color:var(--text);text-decoration:none}
.seg{margin:0 auto;display:flex;background:var(--bg-alt);border-radius:var(--r-pill);padding:4px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;min-height:44px;min-width:104px;padding:0 16px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .25s}
.seg button[aria-pressed="true"]{color:#fff}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:var(--r-pill);background:var(--c-deep);transition:transform .35s var(--spring),opacity .2s;opacity:0}
.seg[data-on="familia"] .knob{opacity:1;transform:translateX(0)}
.seg[data-on="painel"] .knob{opacity:1;transform:translateX(100%)}
.reset{border:1px solid var(--border);background:#fff;border-radius:var(--r-pill);min-height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-2);transition:background .2s,color .2s}
.reset:hover{background:var(--t-lilac);color:var(--c-deep)}
.reset:hover svg{animation:spin .6s var(--ease)}

/* ---------- Comentários da cliente (feedback da demo) ---------- */
.fb-btn{border:1px solid var(--border);background:#fff;border-radius:var(--r-pill);min-height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--c-deep);transition:background .2s}
.fb-btn:hover{background:var(--t-lilac)}
.fb-btn .n{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--c-deep);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
.fb-btn[data-n]:not([data-n="0"]) .n{display:inline-flex}
.fb-body{padding:0 20px;display:flex;flex-direction:column;gap:16px}
.fb-body h2{font-size:20px}
.fb-note{font-size:14px;color:var(--text-2)}
.fb-warn{font-size:13px;background:var(--warn-b);color:var(--warn-t);border-radius:var(--r-sm);padding:10px 12px}
.fb-where{font-size:13px;color:var(--text-2);background:var(--t-lilac);border-radius:var(--r-sm);padding:8px 12px}
.fb-where b{color:var(--c-deep)}
.fb-body .chips{flex-wrap:wrap;overflow:visible}
.fb-list{display:flex;flex-direction:column;gap:10px}
.fb-item{background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-1);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.fb-item .tx{flex:1;min-width:0;font-size:14px}
.fb-item .tg{font-size:12px;font-weight:700;color:var(--c-deep);display:block;margin-bottom:2px}
.fb-item .tx p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.fb-item button{border:0;background:none;min-width:44px;min-height:44px;margin:-8px -8px -8px 0;border-radius:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.fb-item button:hover{background:var(--err-b);color:var(--err-t)}
.fb-empty{font-size:14px;color:var(--muted);text-align:center;padding:8px 0}
.fb-send{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:16px}
.fb-err{font-size:13px;color:var(--err-t);background:var(--err-b);border-radius:var(--r-sm);padding:10px 12px}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s var(--ease),background .2s,box-shadow .2s,opacity .2s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-1{background:var(--c-deep);color:#fff;box-shadow:0 6px 16px rgba(78,84,142,.25)}
.btn-1:hover{background:var(--c-deep-h)}
.btn-2{background:var(--c-lavender);color:var(--text)}
.btn-2:hover{background:#8790BF}
.btn-3{background:#fff;color:var(--c-deep);border-color:var(--border)}
.btn-3:hover{border-color:var(--c-lavender);background:var(--t-lilac)}
.btn-ghost{background:none;color:var(--c-deep);padding:0 10px}
.btn-ghost:hover{background:var(--t-lilac)}
.btn-sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

/* ---------- Chips / badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;line-height:1.5}
.b-ok{background:var(--ok-b);color:var(--ok-t)}
.b-warn{background:var(--warn-b);color:var(--warn-t)}
.b-err{background:var(--err-b);color:var(--err-t)}
.b-lilac{background:var(--t-lilac);color:var(--c-deep)}
.b-neutral{background:var(--bg-alt);color:var(--text-2)}
.b-new{background:var(--c-deep);color:#fff}
.exemplo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-peach-d);background:var(--t-peach);border:1px dashed var(--c-peach);padding:2px 8px;border-radius:var(--r-pill)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;min-width:0;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--text-2);transition:all .22s var(--ease)}
.chip:hover{border-color:var(--c-lavender)}
.chip[aria-pressed="true"]{background:var(--c-deep);border-color:var(--c-deep);color:#fff}

/* ---------- Cards ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:20px}
.card-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.tint-lilac{background:var(--t-lilac)} .tint-green{background:var(--t-green)} .tint-blue{background:var(--t-blue)} .tint-yellow{background:var(--t-yellow)} .tint-peach{background:var(--t-peach)}

/* ---------- Campos ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--text)}
.input{width:100%;min-height:48px;border:1.5px solid var(--border);background:#fff;border-radius:14px;padding:0 14px;font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea.input{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.5}
.input:hover{border-color:#D3D9E3}
.input:focus{outline:none;border-color:var(--c-lilac);box-shadow:0 0 0 4px rgba(129,130,184,.18)}
.input.bad{border-color:var(--err);box-shadow:0 0 0 4px rgba(194,69,61,.10)}
.input.good{border-color:var(--c-green)}
.hint{font-size:12px;color:var(--text-2)}
.hint.bad{color:var(--err-t);font-weight:600}
.unit-wrap{position:relative}
.unit-wrap .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-2);pointer-events:none}

/* ---------- Animações ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes ping{0%{r:6;opacity:.6}100%{r:20;opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes peek{from{transform:translateY(40%) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}}
@keyframes highlight{0%{box-shadow:0 0 0 0 rgba(129,130,184,.55)}100%{box-shadow:0 0 0 14px rgba(129,130,184,0)}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(40px)}}
.view-enter{animation:fadeUp .38s var(--ease) both}
.stagger>*{animation:fadeUp .45s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}.stagger>*:nth-child(n+8){animation-delay:.35s}
.float{animation:float 5s ease-in-out infinite}
.sway{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
.shake{animation:shake .45s var(--ease)}
.glow{animation:highlight 1.4s var(--ease) 3}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.1s var(--ease) both}
.ping{animation:ping 1.6s ease-out infinite}

/* ---------- Toast & modal ---------- */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.phone-screen .toasts{position:absolute;bottom:92px;width:calc(100% - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:#fff;padding:12px 16px;border-radius:18px;box-shadow:var(--sh-2);font-size:14px;font-weight:500;animation:fadeUp .35s var(--spring) both;width:100%}
.toast img{width:38px;height:auto;margin:-10px 0 -12px -4px}
.toast.out{animation:fadeIn .25s reverse both}
.modal-bg{position:fixed;inset:0;z-index:110;background:rgba(36,48,71,.32);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s both}
.modal{background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:24px;width:min(100%,420px);display:flex;flex-direction:column;gap:14px;animation:pop .35s var(--spring) both}
.modal h2{font-size:20px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* =========================================================
   ESCOLHA INICIAL
   ========================================================= */
.chooser{min-height:calc(100vh - var(--demobar));position:relative;overflow:hidden;padding:48px 20px 64px;display:flex;flex-direction:column;align-items:center}
.bubble{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.chooser>*:not(.bubble):not(.deco){position:relative;z-index:1}
.deco{position:absolute;pointer-events:none;z-index:0;opacity:.95}
.chooser .logo{width:250px;margin-bottom:28px}
.chooser h1{font-size:clamp(26px,4vw,36px);font-weight:800;text-align:center;max-width:720px}
.chooser .lead{margin-top:12px;font-size:17px;color:var(--text-2);text-align:center;max-width:620px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:36px;width:min(100%,860px)}
.choice{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:0;border-radius:var(--r-xl);padding:28px 28px 0;min-height:300px;overflow:hidden;box-shadow:var(--sh-1);transition:transform .3s var(--ease),box-shadow .3s}
.choice:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.choice:active{transform:scale(.985)}
.choice .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.choice .h2{font-size:24px;font-weight:800;line-height:1.25}
.choice .pp{font-size:14px;color:var(--text-2);max-width:62%}
.choice p{font-size:14px;color:var(--text-2);max-width:62%}
.choice .go{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c-deep);font-size:15px}
.choice .go svg{transition:transform .25s var(--ease)}
.choice:hover .go svg{transform:translateX(4px)}
.choice img{position:absolute;right:-6px;bottom:0;transition:transform .45s var(--ease)}
.choice:hover img{transform:translateY(-6px) scale(1.02)}
.choice.doc{background:var(--t-lilac)} .choice.doc img{height:92%;right:14px}
.choice.fam{background:var(--t-yellow)} .choice.fam img{width:42%;max-width:220px}
.choice>*:not(img){position:relative;z-index:1}
.roteiro{margin-top:40px;width:min(100%,860px);display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.steps .n{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--t-lilac);color:var(--c-deep);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.notice{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--text)}
.notice svg{color:var(--c-peach-d);margin-top:2px}

/* =========================================================
   VISÃO DA FAMÍLIA (celular)
   ========================================================= */
.fam-stage{min-height:calc(100vh - var(--demobar));display:flex;align-items:center;justify-content:center;gap:56px;padding:24px;position:relative;overflow:hidden;background:#EEF1F9}
.fam-caption{width:300px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.fam-caption h2{font-size:26px;font-weight:800}
.fam-caption p{color:var(--text-2);font-size:15px}
.fam-caption .tip{background:#fff;border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh-1);font-size:14px;display:flex;gap:10px}
.fam-caption .tip svg{color:var(--c-deep)}
.phone{width:390px;height:min(844px,calc(100vh - var(--demobar) - 48px));min-height:560px;background:#fff;border-radius:46px;padding:10px;box-shadow:var(--sh-phone);position:relative;z-index:1;flex-shrink:0}
.phone-screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.fam-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding-bottom:96px;-webkit-overflow-scrolling:touch}
.fam-scroll.no-tabs{padding-bottom:24px}
.fam-scroll::-webkit-scrollbar{width:0}
.fam-pad{padding:0 20px}
.fhead{padding:22px 20px 8px;display:flex;align-items:center;gap:12px}
.fhead .t{flex:1;min-width:0}
.fhead h1{font-size:24px;font-weight:800}
.fhead .s{font-size:13px;color:var(--text-2)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;margin-left:-6px;border:0;background:none;color:var(--c-deep);font-weight:700;font-size:14px;border-radius:12px}
.back:hover{background:var(--t-lilac)}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.av-lilac{background:var(--t-lilac);color:var(--c-deep)} .av-green{background:var(--t-green);color:var(--c-green-d)} .av-blue{background:var(--t-blue);color:var(--c-blue-d)} .av-yellow{background:var(--t-yellow);color:var(--c-yellow-d)} .av-peach{background:var(--t-peach);color:var(--c-peach-d)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh-1);display:flex;align-items:center;justify-content:center;color:var(--c-deep)}
.sec{padding:18px 20px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h a,.sec-h button{font-size:13px;font-weight:700;color:var(--c-deep);background:none;border:0;padding:8px 4px;text-decoration:none}

/* Hero novo */
.hero{position:relative;border-radius:var(--r-lg);padding:20px;overflow:hidden;background:var(--c-deep);color:#fff;min-height:168px}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;display:flex;gap:6px;align-items:center}
.hero h3{font-size:19px;font-weight:800;margin-top:6px;max-width:64%}
.hero p{font-size:13px;opacity:.9;margin-top:4px;max-width:62%}
.hero .btn{margin-top:14px;background:#fff;color:var(--c-deep);min-height:44px;font-size:14px;box-shadow:none}
.hero img{position:absolute;right:-8px;bottom:-14px;width:122px;animation:peek .7s var(--spring) .2s both}
.hero .bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero.calm{background:var(--t-lilac);color:var(--text)}
.hero.calm .btn{background:var(--c-deep);color:#fff}
/* Categorias */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font-size:12px;font-weight:600;color:var(--text);border-radius:16px;min-height:44px}
.cat .c{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--spring)}
.cat:hover .c,.cat:focus-visible .c{transform:translateY(-3px) scale(1.06)}
.cat:active .c{transform:scale(.92)}
.c-green{background:var(--t-green);color:var(--c-green-d)} .c-yellow{background:var(--t-yellow);color:var(--c-yellow-d)} .c-blue{background:var(--t-blue);color:var(--c-blue-d)} .c-peach{background:var(--t-peach);color:var(--c-peach-d)} .c-lilac{background:var(--t-lilac);color:var(--c-deep)}
/* Stat cards */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:var(--r-md);padding:14px 14px 0;overflow:hidden;border:0;text-align:left;display:flex;flex-direction:column;transition:transform .25s var(--ease)}
.stat:active{transform:scale(.98)}
.stat .l{font-size:12px;font-weight:600;color:var(--text-2)}
.stat .v{font-size:22px;font-weight:800;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--text-2)}
.stat svg.spark{margin:6px -14px 0;width:calc(100% + 28px);height:46px;display:block}
/* Timeline */
.tl{display:flex;flex-direction:column;gap:14px;position:relative}
.tl:before{content:"";position:absolute;left:17px;top:8px;bottom:8px;width:2px;background:var(--border);border-radius:2px}
.tl-item{display:flex;gap:12px;position:relative}
.tl-dot{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;border:3px solid var(--bg)}
.tl-card{flex:1;min-width:0;background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-1);padding:14px}
.tl-card .top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--text-2)}
.tl-card h3{font-size:15px;font-weight:700;margin-top:4px}
.tl-rows{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.tl-row{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 8px;margin:0 -8px;border-radius:12px;border:0;background:none;text-align:left;font-size:13px;color:var(--text);width:calc(100% + 16px);text-decoration:none}
button.tl-row:hover,a.tl-row:hover{background:var(--bg-alt)}
.tl-row .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tl-row .tx{flex:1;min-width:0}
.tl-row .tx b{display:block;font-weight:600}
.tl-row .tx span{color:var(--text-2);font-size:12px}
.quote{margin-top:10px;background:var(--t-lilac);border-radius:14px;padding:10px 12px;font-size:13px;position:relative}
.quote b{display:block;font-size:12px;color:var(--c-deep);margin-bottom:2px}
.new-item .tl-card{box-shadow:0 0 0 2px var(--c-lavender),var(--sh-1)}
/* Tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabbar .ind{position:absolute;top:8px;left:6px;width:calc((100% - 12px)/5);height:34px;display:flex;justify-content:center;transition:transform .4s var(--spring);pointer-events:none}
.tabbar .ind:before{content:"";width:52px;height:34px;border-radius:var(--r-pill);background:var(--t-lilac)}
.tab{flex:1;position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;min-height:56px;color:var(--muted);font-size:11px;font-weight:600;transition:color .25s}
.tab svg{transition:transform .3s var(--spring)}
.tab[aria-current="page"]{color:var(--c-deep)}
.tab[aria-current="page"] svg{transform:translateY(-1px)}
.tab:active svg{transform:scale(.85)}
/* Lista genérica */
.list{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border:0;background:none;width:100%;text-align:left;text-decoration:none;color:var(--text);border-top:1px solid var(--border)}
.li:first-child{border-top:0}
button.li:hover,a.li:hover{background:var(--bg-alt)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:15px;font-weight:600}
.li .tx span{display:block;font-size:13px;color:var(--text-2)}
.li .chev{color:var(--muted)}
.li[aria-disabled="true"]{cursor:default}
.li[aria-disabled="true"] .tx b{color:var(--text-2)}
/* Material cards */
.mat{display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-1);padding:12px;border:0;width:100%;text-align:left;text-decoration:none;color:var(--text);transition:transform .2s var(--ease),box-shadow .2s}
.mat:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.mat:active{transform:scale(.985)}
.mat .th{width:64px;height:64px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mat .tx{flex:1;min-width:0}
.mat .k{font-size:12px;font-weight:700;color:var(--text-2)}
.mat h3{font-size:15px;font-weight:700;margin:2px 0}
.mat .m{font-size:12px;color:var(--text-2)}
/* Material aberto */
.cover{position:relative;margin:0 20px;border-radius:var(--r-lg);height:190px;overflow:hidden;display:flex;align-items:flex-end}
.cover img.il{position:absolute;right:12px;bottom:-6px;height:96%;width:auto}
.cover .deco-s{position:absolute;width:44px}
.cover .play{position:absolute;left:20px;bottom:20px;width:64px;height:64px;border-radius:50%;border:0;background:#fff;color:var(--c-deep);box-shadow:var(--sh-2);display:flex;align-items:center;justify-content:center;transition:transform .3s var(--spring)}
.cover .play:hover{transform:scale(1.08)}
.prose{padding:0 20px;display:flex;flex-direction:column;gap:12px}
.prose h1{font-size:24px;font-weight:800}
.prose h2{font-size:17px;font-weight:700;margin-top:8px}
.prose p,.prose li{font-size:15px;line-height:1.65}
.prose ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.prose li{display:flex;gap:10px}
.prose li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-lavender);flex-shrink:0;margin-top:9px}
.by{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2)}
.by img{width:36px;height:36px;border-radius:50%;background:var(--t-lilac);object-fit:cover}
.alert-box{background:var(--err-b);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:12px}
.alert-box svg{color:var(--err-t);margin-top:1px}
.alert-box b{display:block;color:var(--err-t);font-size:14px}
.alert-box p{font-size:14px;color:#5A1F1A;margin-top:2px}
/* Crescimento */
.metric-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg-alt);border-radius:var(--r-pill);padding:4px;position:relative}
.metric-tabs .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:var(--r-pill);background:#fff;box-shadow:var(--sh-1);transition:transform .4s var(--spring)}
.metric-tabs button{position:relative;z-index:1;border:0;background:none;min-height:44px;border-radius:var(--r-pill);font-size:13px;font-weight:700;color:var(--text-2);transition:color .2s}
.metric-tabs button[aria-pressed="true"]{color:var(--c-deep)}
.chart-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:14px 10px 12px}
.chart-card svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 8px 0;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:8px;border-radius:4px;display:inline-block}
.big-v{display:flex;align-items:baseline;gap:8px;padding:0 8px 6px}
.big-v b{font-size:28px;font-weight:800}
.big-v span{font-size:13px;color:var(--text-2)}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{text-align:left;font-size:12px;color:var(--text-2);font-weight:600;padding:8px 0}
.mtable td{padding:10px 0;border-top:1px solid var(--border)}
.mtable td:last-child,.mtable th:last-child{text-align:right}
/* Marcos */
.ms{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.ms:first-of-type{border-top:0}
.ms .tx{flex:1;font-size:14px;font-weight:500}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap}
.st-a{background:var(--ok-b);color:var(--ok-t)} .st-o{background:var(--warn-b);color:var(--warn-t)} .st-n{background:var(--bg-alt);color:var(--text-2)} .st-x{background:#fff;color:var(--muted);border:1px dashed var(--border)}
/* Registros */
.info{display:flex;gap:12px;background:var(--t-yellow);border-radius:var(--r-md);padding:14px 16px;font-size:13px;color:var(--text)}
.info svg{color:var(--c-yellow-d);margin-top:1px}
.vac-group{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);padding:14px 16px 4px;background:#fff}
.vac{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;border-top:1px solid var(--border);background:#fff;transition:background .4s}
.vac .tx{flex:1;min-width:0}
.vac .tx b{display:block;font-size:14px;font-weight:600}
.vac .tx span{font-size:12px;color:var(--text-2)}
.vac .ok-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg-alt);color:var(--muted);transition:all .35s var(--spring)}
.vac.done .ok-ic{background:var(--ok-b);color:var(--ok-t)}
.vac.just{background:var(--t-green)}
.vac.just .ok-ic{animation:pop .5s var(--spring)}
.mark{min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--c-lavender);background:#fff;color:var(--c-deep);font-size:13px;font-weight:700;white-space:nowrap;transition:all .2s}
.mark:hover{background:var(--t-lilac)}
.mark:active{transform:scale(.95)}
/* Sheet */
.sheet-bg{position:absolute;inset:0;z-index:20;background:rgba(36,48,71,.32);animation:fadeIn .2s both;display:flex;align-items:flex-end}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:fadeUp .35s var(--ease) both;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 4px}
.sheet h2{font-size:19px;font-weight:800}
/* Documento */
.paper{margin:0 20px;background:#fff;border-radius:12px;box-shadow:var(--sh-2);padding:22px 20px;position:relative;overflow:hidden;min-height:420px;display:flex;flex-direction:column;gap:12px}
.paper .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:62px;font-weight:800;color:rgba(213,166,126,.16);transform:rotate(-28deg);letter-spacing:.08em}
.paper .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--t-lilac);padding-bottom:12px}
.paper .ph img{width:150px}
.paper .skel{height:9px;border-radius:5px;background:var(--bg-alt)}
.paper .ttl{font-size:13px;font-weight:800;letter-spacing:.1em;text-align:center;color:var(--c-deep)}
.paper .meta{font-size:12px;color:var(--text-2)}
.paper .body{font-size:13px;line-height:1.6}
.paper .omit{background:var(--t-peach);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--c-peach-d);font-weight:600}
.paper .sign{margin-top:auto;align-self:flex-end;text-align:center;font-size:11px;color:var(--text-2);border-top:1px solid var(--text-2);padding-top:4px;width:170px}
.doc-actions{display:flex;gap:10px;padding:16px 20px 0}
.doc-actions .btn{flex:1}
/* PIN */
.pin-wrap{min-height:100%;padding:28px 24px 24px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.pin-wrap .logo{width:200px}
.pin-wrap .bear{width:150px;align-self:center;margin:-4px 0 -8px}
.pin-wrap h1{font-size:26px;font-weight:800;text-align:center}
.pin-wrap .sub{font-size:15px;color:var(--text-2);text-align:center}
.pin-boxes{display:flex;gap:8px;justify-content:center;position:relative}
.pin-box{width:46px;height:56px;border-radius:14px;background:#fff;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .25s var(--spring)}
.pin-box.on{border-color:var(--c-lilac);background:var(--t-lilac)}
.pin-box.on:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--c-deep);animation:pop .3s var(--spring)}
.pin-box.cur{border-color:var(--c-lilac);box-shadow:0 0 0 4px rgba(129,130,184,.18)}
.pin-boxes.ok .pin-box{background:var(--ok-b);border-color:var(--c-green)}
.pin-boxes.ok .pin-box:after{background:var(--ok-t)}
.pin-input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:text}
.demo-note{font-size:12px;color:var(--text-2);text-align:center;background:var(--bg-alt);border-radius:12px;padding:10px 12px}

/* =========================================================
   PAINEL DA MÉDICA
   ========================================================= */
.panel{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - var(--demobar))}
.side{position:sticky;top:var(--demobar);height:calc(100vh - var(--demobar));background:#fff;border-right:1px solid var(--border);padding:24px 16px 16px;display:flex;flex-direction:column;gap:4px}
.side .logo{width:200px;margin:0 8px 24px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:14px;border:0;background:none;width:100%;text-align:left;color:var(--text-2);font-size:14px;font-weight:600;text-decoration:none;transition:background .2s,color .2s;position:relative}
.nav-i:hover{background:var(--bg-alt);color:var(--text)}
.nav-i[aria-current="page"]{background:var(--t-lilac);color:var(--c-deep)}
.nav-i[aria-current="page"]:before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c-deep)}
.nav-i .soon{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--border)}
.side .me img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--t-lilac)}
.side .me .tx{flex:1;min-width:0;font-size:13px}
.side .me .tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .me .tx span{color:var(--text-2);font-size:12px}
.pmain{padding:32px clamp(16px,3vw,40px) 56px;max-width:1360px;width:100%;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ph .crumb{font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ph .crumb a{color:var(--text-2);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;min-height:44px}
.ph .crumb a:hover{color:var(--c-deep)}
.ph h1{font-size:28px;font-weight:800;margin-top:4px}
.ph .sub{color:var(--text-2);font-size:15px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
.kpi{border-radius:var(--r-lg);padding:18px 20px;display:flex;align-items:center;gap:14px}
.kpi .c{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.kpi span{font-size:13px;color:var(--text-2);font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.search{position:relative;flex:1;max-width:340px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:44px}
.ptable{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.3fr);gap:12px;align-items:center;padding:12px 18px;min-height:68px;border:0;border-top:1px solid var(--border);background:none;width:100%;text-align:left;text-decoration:none;color:var(--text);font-size:14px;transition:background .2s}
.prow.head{min-height:44px;background:var(--bg-alt);border-top:0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
a.prow:hover{background:#FAFBFE}
a.prow[aria-current="true"]{background:var(--t-lilac)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .tx{min-width:0}
.who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--text-2)}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-terra);margin-left:6px;vertical-align:middle;animation:pulse 1.8s infinite}
.detail{display:flex;flex-direction:column;gap:16px}
.detail .card{padding:20px}
.dh{display:flex;gap:14px;align-items:center}
.dh h2{font-size:21px;font-weight:800}
.dh .s{font-size:13px;color:var(--text-2)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}
.linkbox{display:flex;align-items:center;gap:8px;background:var(--bg-alt);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--text-2);overflow:hidden}
.linkbox span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:14px;align-items:center}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--text-2)}
.reg{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:14px}
.reg .tx{flex:1;min-width:0}
.reg .tx span{display:block;font-size:12px;color:var(--text-2)}
.reg.fresh{background:linear-gradient(90deg,var(--t-yellow),transparent);margin:0 -20px;padding:10px 20px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini3 div{border-radius:14px;padding:10px 12px}
.mini3 span{display:block;font-size:11px;font-weight:600;color:var(--text-2)}
.mini3 b{font-size:16px;font-weight:800}
/* Publicar */
.pub-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.pub-steps{display:flex;flex-direction:column;gap:18px}
.step{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .3s}
.step:focus-within{box-shadow:0 0 0 2px var(--t-lilac),var(--sh-2)}
.step-h{display:flex;align-items:center;gap:12px}
.step-h .n{width:34px;height:34px;border-radius:50%;background:var(--t-lilac);color:var(--c-deep);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .35s var(--spring)}
.step.done .step-h .n{background:var(--c-green);color:#fff}
.step-h h2{font-size:17px;font-weight:700;flex:1}
.step-h .opt{font-size:12px;color:var(--text-2);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--c-deep)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.mrow:first-of-type{border-top:0}
.mrow .tx{font-size:14px;font-weight:500;flex:1;min-width:180px}
.mrow .tx span{display:block;font-size:12px;color:var(--text-2);font-weight:400}
.tri{display:flex;background:var(--bg-alt);border-radius:12px;padding:3px;gap:2px}
.tri button{border:0;background:none;min-height:44px;padding:0 10px;border-radius:10px;font-size:12px;font-weight:700;color:var(--text-2);transition:all .2s var(--ease);display:flex;align-items:center;gap:4px}
.tri button:hover{color:var(--text)}
.tri button[aria-pressed="true"][data-v="a"]{background:var(--ok-b);color:var(--ok-t)}
.tri button[aria-pressed="true"][data-v="o"]{background:var(--warn-b);color:var(--warn-t)}
.tri button[aria-pressed="true"][data-v="n"]{background:#fff;color:var(--text);box-shadow:var(--sh-1)}
.dx{display:flex;flex-wrap:wrap;gap:8px}
.pkg{display:flex;flex-direction:column;gap:4px}
.pkg-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--bg-alt);animation:fadeUp .35s var(--ease) both;min-height:52px}
.pkg-item input{width:20px;height:20px;accent-color:var(--c-deep);flex-shrink:0}
.pkg-item .tx{flex:1;font-size:14px;font-weight:600}
.pkg-item .tx span{display:block;font-size:12px;color:var(--text-2);font-weight:500}
.pkg-item .th{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drop{border:2px dashed #CDD3E0;border-radius:var(--r-md);padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-2);font-size:14px;transition:all .25s;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--c-lilac);background:var(--t-lilac);color:var(--c-deep)}
.drop .c{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--c-deep);box-shadow:var(--sh-1)}
.filecard{display:flex;align-items:center;gap:12px;border-radius:14px;background:var(--t-blue);padding:12px 14px;animation:pop .35s var(--spring) both}
.filecard .fi{width:40px;height:48px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--c-blue-d)}
.filecard .tx{flex:1;min-width:0;font-size:14px;font-weight:600}
.filecard .tx span{display:block;font-size:12px;color:var(--text-2);font-weight:500}
.filecard select{min-height:40px;border-radius:10px;border:1px solid var(--border);padding:0 8px;background:#fff;font-size:13px}
.preview{position:sticky;top:calc(var(--demobar) + 20px);display:flex;flex-direction:column;gap:14px}
.timer{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c-deep);background:var(--t-lilac);padding:6px 12px;border-radius:var(--r-pill)}
.timer.late{background:var(--warn-b);color:var(--warn-t)}
.mini-phone{background:var(--c-deep);border-radius:32px;padding:8px;box-shadow:var(--sh-2)}
.mini-screen{background:var(--bg);border-radius:26px;padding:16px 14px;min-height:360px;display:flex;flex-direction:column;gap:10px}
.mini-screen .mh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-2)}
.mini-screen .mh b{color:var(--text);font-size:14px;display:block}
.pv{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--sh-1);font-size:13px;animation:fadeUp .3s var(--ease) both}
.pv .ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pv .ic svg{width:16px;height:16px}
.pv b{display:block;font-size:12px;color:var(--text-2);font-weight:700}
.pv-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--text-2);gap:8px;padding:12px}
.pv-empty img{width:86px;opacity:.95}
/* Após publicar */
.success{max-width:640px;margin:0 auto;position:relative}
.success .card{padding:32px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:visible}
.check-anim{width:72px;height:72px;border-radius:50%;background:var(--ok-b);display:flex;align-items:center;justify-content:center;color:var(--ok-t);animation:pop .55s var(--spring) both}
.check-anim svg{width:38px;height:38px;stroke-width:2.6}
.check-anim path{stroke-dasharray:30;stroke-dashoffset:0;animation:dash .5s .35s var(--ease) both}
@keyframes dash{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.success .bear{position:absolute;right:-150px;top:10px;width:160px;animation:peek .8s var(--spring) .25s both}
@media (max-width:1300px){.success .bear{right:-8px;top:-118px;width:120px}.success{margin-top:96px}}
.msg{background:var(--bg-alt);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px}
.confetti{position:absolute;left:50%;top:60px;pointer-events:none;z-index:3}
.confetti i{position:absolute;width:12px;height:12px;border-radius:3px;animation:burst 1.4s var(--ease) both}
/* Biblioteca / diagnósticos */
.mtab{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.mtr{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:center;padding:12px 18px;min-height:64px;border:0;border-top:1px solid var(--border);background:none;width:100%;text-align:left;font-size:14px;color:var(--text);transition:background .2s}
.mtr.head{min-height:44px;background:var(--bg-alt);border-top:0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
button.mtr:hover{background:#FAFBFE}
.mtr .who b{font-weight:700}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.drawer-bg{position:fixed;inset:var(--demobar) 0 0 0;z-index:90;background:rgba(36,48,71,.28);animation:fadeIn .2s both;display:flex;justify-content:flex-end}
.drawer{width:min(100%,440px);height:100%;background:var(--bg);overflow-y:auto;animation:slideIn .35s var(--ease) both;padding-bottom:32px}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:sticky;top:0;background:rgba(248,250,253,.95);backdrop-filter:blur(8px);z-index:2}
.dx-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.dx-list{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:8px}
.dx-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;min-height:56px;border-radius:14px;font-size:14px;color:var(--text);transition:background .2s}
.dx-i:hover{background:var(--bg-alt)}
.dx-i[aria-current="true"]{background:var(--t-lilac)}
.dx-i .tx{flex:1}
.dx-i .tx b{display:block;font-weight:700}
.dx-i .tx span{font-size:12px;color:var(--text-2)}
.pk-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);animation:fadeUp .3s var(--ease) both}
.pk-row:first-child{border-top:0}
.pk-row .tx{flex:1;font-size:14px;font-weight:600}
.pk-row .tx span{display:block;font-size:12px;color:var(--text-2);font-weight:500}
/* Login */
.login{min-height:calc(100vh - var(--demobar));display:grid;grid-template-columns:1fr 1fr;background:#fff}
.login .art{background:var(--t-lilac);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
/* a foto não define a altura da tela: fica presa ao rodapé da coluna e é cortada no busto */
.login .art img.dra{position:absolute;bottom:0;left:0;right:0;margin-inline:auto;width:min(80%,480px);height:calc(100% - 210px);min-height:240px;object-fit:cover;object-position:50% 0;z-index:1;animation:fadeUp .7s var(--ease) both}
.login .art .q{position:absolute;left:40px;top:44px;max-width:300px;z-index:2}
.login .art .q b{font-size:28px;font-weight:800;line-height:1.2;display:block}
.login .art .q span{display:block;margin-top:8px;color:var(--text-2)}
.login .form{display:flex;align-items:center;justify-content:center;padding:32px 24px}
.login .box{width:min(100%,400px);display:flex;flex-direction:column;gap:18px}
.login .box .logo{width:230px;margin-bottom:8px}


/* =========================================================
   v2 — PAINEL: tabela com linha expansível e resumo
   ========================================================= */
.ph-tools{display:flex;gap:10px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.ph-tools .search{flex:1 1 240px;max-width:340px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.pside{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--demobar) + 16px)}
.pside .kpi{padding:16px 18px}
.pside .kpi b{font-size:24px}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;margin-left:8px;border-radius:var(--r-pill);background:var(--c-deep);color:#fff;font-size:12px;font-weight:800;letter-spacing:0;box-shadow:0 3px 8px rgba(78,84,142,.28),inset 0 -2px 0 rgba(0,0,0,.14);vertical-align:middle}
.prow-item{border-top:1px solid var(--border)}
.prow-item .prow{border-top:0}
button.prow{cursor:pointer;font:inherit;color:var(--text)}
button.prow:hover{background:#FAFBFE}
button.prow[aria-expanded="true"]{background:var(--t-lilac)}
.prow .chev-x{display:inline-flex;color:var(--muted);transition:transform .3s var(--ease),color .2s;margin-right:-4px}
.prow[aria-expanded="true"] .chev-x{transform:rotate(90deg);color:var(--c-deep)}
.c-status{display:flex;align-items:center}
.st-none{color:var(--muted);font-weight:700;font-size:18px;line-height:1;padding-left:8px}
.b-novo{background:var(--c-peach-d);color:#fff}
.xp-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease-in}
.xp-wrap.open{grid-template-rows:1fr;transition:grid-template-rows .55s cubic-bezier(.34,1.25,.64,1)}
.xp-clip{overflow:hidden;min-height:0}
.xp{position:relative;margin:6px 14px 18px 40px;padding:20px;border-radius:20px;background:#F2F3FA;border:1px solid #D9DCEF;box-shadow:inset 0 2px 8px rgba(78,84,142,.10);opacity:0;transform:translateY(-8px);transition:opacity .16s,transform .2s}
.xp:before{content:"";position:absolute;left:-22px;top:-6px;bottom:28px;width:3px;border-radius:3px;background:var(--c-lavender);opacity:.55}
.xp-wrap.open .xp{opacity:1;transform:none;transition:opacity .3s .08s,transform .5s .04s var(--spring)}
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
.xp.glow-run:after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;background:conic-gradient(from var(--ga),transparent 0deg,transparent 220deg,rgba(146,155,199,.35) 290deg,#8182B8 335deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sweep 1.2s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes sweep{0%{--ga:0deg;opacity:0}12%{opacity:1}78%{opacity:1}100%{--ga:360deg;opacity:0}}
.xp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:16px;border-bottom:1px dashed #CDD1E8}
.xp-head .nm{flex:1;min-width:200px}
.xp-head h2{font-size:20px;font-weight:800}
.xp-actions{display:flex;gap:8px;flex-wrap:wrap}
.xp-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.xp-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.xp-card{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--sh-1)}
.xp-card>.card-t{display:block;margin-bottom:8px}
.xp-card .reg.fresh{margin:0 -18px;padding:10px 18px}
.reg .origin{font-weight:600;color:var(--c-deep)!important}
.nx-mini{display:flex;gap:12px;align-items:center}
.rs{border-top:4px solid var(--c-deep)}
.rs-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rs-h h3{font-size:18px;font-weight:800}
.rs-h .btn{margin-left:auto}
.rs-sub{font-size:13px;color:var(--text-2);margin-top:2px}
.rs-warn{display:flex;gap:8px;align-items:flex-start;background:var(--warn-b);color:var(--warn-t);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin:12px 0 4px}
.rs-warn svg{margin-top:1px}
.rs-f{padding:12px 0;border-top:1px solid var(--border)}
.rs-body .rs-f:first-child,.rs-form .rs-f:first-child{border-top:0}
.rs-f .lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c-deep);margin-bottom:4px}
.rs-f p{font-size:14px;line-height:1.6;white-space:pre-wrap}
.rs-f p.empty{color:var(--muted);font-style:italic}
.rs-f textarea.input{min-height:64px;overflow:hidden;resize:none}
.rs-empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 0 2px;color:var(--text-2);font-size:14px}
.rs-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
/* Publicar: diagnóstico */
.yellow-note{display:flex;gap:10px;align-items:flex-start;background:var(--t-yellow);border:1px solid var(--c-yellow-p);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--text)}
.yellow-note svg{color:var(--c-yellow-d);margin-top:1px}
.lib-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
/* Caixas do painel (modal no desktop, folha inferior no celular) */
.pmodal-bg{position:fixed;inset:0;z-index:105;background:rgba(36,48,71,.32);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s both}
.pmodal{background:#fff;border-radius:24px;box-shadow:var(--sh-2);width:min(100%,600px);max-height:calc(100vh - 32px);overflow:auto;animation:pop .35s var(--spring) both;display:flex;flex-direction:column;overscroll-behavior:contain}
.pm-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 10px;position:sticky;top:0;background:#fff;z-index:2}
.pm-h h2{font-size:20px;font-weight:800;margin-top:2px}
.pm-h h2::first-letter{text-transform:uppercase}
.pm-b{padding:6px 22px 4px;display:flex;flex-direction:column;gap:16px}
.pm-f{padding:4px 0 18px}
.pm-f.pad{padding:12px 22px 20px}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.optb{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:14px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s var(--ease)}
.optb:hover{border-color:var(--c-lavender);color:var(--text)}
.optb[aria-pressed="true"]{border-color:var(--c-deep);background:var(--t-lilac);color:var(--c-deep)}
.optb:active{transform:scale(.97)}
.optb.big{flex:1 1 120px;min-height:76px;flex-direction:column;gap:2px;background:#fff;color:var(--text-2);font-size:14px}
.optb.big small{font-size:12px;font-weight:600;opacity:.85}
.optb.big.m-online[aria-pressed="true"]{background:var(--m-on-b);color:var(--m-on-t);border-color:var(--m-on)}
.optb.big.m-consultorio[aria-pressed="true"]{background:var(--m-co-b);color:var(--m-co-t);border-color:var(--m-co)}
.optb.big.m-domicilio[aria-pressed="true"]{background:var(--m-do-b);color:var(--m-do-t);border-color:var(--m-do)}
.ap-sel{display:flex;align-items:center;gap:12px;border:1.5px solid var(--c-lavender);background:var(--t-lilac);border-radius:14px;padding:8px 8px 8px 12px}
.ap-sel .tx{flex:1;min-width:0}.ap-sel b{display:block}.ap-sel .tx span{font-size:12px;color:var(--text-2)}
.ap-sug{display:flex;flex-direction:column;gap:4px;margin-top:6px;align-items:flex-start}
.ap-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;background:var(--bg-alt);border-radius:12px;padding:6px 10px;text-align:left;transition:background .2s}
.ap-opt:hover{background:var(--t-lilac)}
.ap-opt b{display:block;font-size:14px}.ap-opt .tx span{font-size:12px;color:var(--text-2)}
.ap-sum{display:flex;align-items:center;gap:8px;background:var(--t-lilac);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--c-deep)}
.conf{background:var(--err-b);border-radius:14px;padding:14px 16px;color:#5A1F1A;font-size:14px;display:flex;flex-direction:column;gap:6px;animation:fadeUp .3s var(--ease) both}
.conf>b{display:flex;gap:8px;align-items:center;color:var(--err-t);font-size:15px}
.conf ul{margin:0;padding-left:18px}
.conf .optb{background:#fff}
/* Agenda */
.m-online{background:var(--m-on-b);color:var(--m-on-t)}
.m-consultorio{background:var(--m-co-b);color:var(--m-co-t)}
.m-domicilio{background:var(--m-do-b);color:var(--m-do-t)}
.mtag-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;flex-shrink:0}
.mtag-ic.xs{width:18px;height:18px;border-radius:6px}
.mtag-ic.xs svg{width:12px;height:12px}
.ag-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ag-month{display:flex;align-items:center;gap:6px}
.ag-month h2{font-size:20px;font-weight:800;min-width:190px;text-align:center}
.ag-month h2::first-letter{text-transform:uppercase}
.vseg{display:flex;background:var(--bg-alt);border-radius:var(--r-pill);padding:4px;gap:2px;margin-left:auto}
.vseg button{border:0;background:none;min-height:44px;padding:0 14px;border-radius:var(--r-pill);font-weight:700;font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.vseg button[aria-pressed="true"]{background:#fff;color:var(--c-deep);box-shadow:var(--sh-1)}
.ag-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:14px}
.ag-legend .lg{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.cal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h span{padding:10px 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);background:var(--bg-alt)}
.cal-d{min-height:124px;border-top:1px solid var(--border);border-left:1px solid var(--border);padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.cal-d:nth-child(7n+1){border-left:0}
.cal-d.out{background:#FAFBFD}
.cal-d.out .dn b{color:var(--muted);font-weight:600}
.cal-d .dn{display:flex;align-items:center;justify-content:space-between;font-size:13px;min-height:32px}
.cal-d .dn b{padding:2px 8px;border-radius:var(--r-pill)}
.cal-d.today .dn b{background:var(--c-deep);color:#fff}
.cal-add{width:44px;height:44px;margin:-6px -8px -6px 0;border-radius:50%;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s,background .2s}
.cal-d:hover .cal-add,.cal-add:focus-visible{opacity:1}
.cal-add:hover{background:var(--t-lilac);color:var(--c-deep)}

<script>
'use strict';
/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const KEY = 'larissa-demo-v2';
const A = n => 'assets/' + n;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const iso = d => new Date(d).toISOString();
const addM = (d, m) => { const x = new Date(d); x.setMonth(x.getMonth() + m); return x; };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dm = s => { const d = new Date(s); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); };
const dLong = s => { const d = new Date(s); return d.getDate() + ' de ' + MESES[d.getMonth()]; };
const today = () => { const d = new Date(); return DIAS[d.getDay()] + ', ' + dLong(d); };
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
function rel(s){
  const days = Math.round((new Date().setHours(0,0,0,0) - new Date(s).setHours(0,0,0,0)) / 864e5);
  if (days <= 0) return 'hoje'; if (days === 1) return 'ontem';
  if (days < 14) return 'há ' + days + ' dias';
  if (days < 60) return 'há ' + Math.round(days/7) + ' semanas';
  return 'há ' + Math.round(days/30.4) + ' meses';
}
function ageM(birth, at = new Date()){ return (new Date(at) - new Date(birth)) / (864e5 * 30.4375); }
function ageText(birth, at = new Date()){
  const m = Math.floor(ageM(birth, at));
  if (m < 1) { const d = Math.max(0, Math.round((new Date(at) - new Date(birth)) / 864e5)); return d + (d === 1 ? ' dia' : ' dias'); }
  if (m < 24) return m + (m === 1 ? ' mês' : ' meses');
  const y = Math.floor(m / 12), r = m % 12;
  return y + ' anos' + (r ? ' e ' + r + (r === 1 ? ' mês' : ' meses') : '');
}
const num = s => { const v = parseFloat(String(s).replace(',', '.')); return isFinite(v) ? v : null; };
const fmt = (v, d = 1) => v == null ? '—' : v.toFixed(d).replace('.', ',');
const initials = n => n.split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();

/* Ícones (traço arredondado, linguagem única) */
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',

function mkMeasures(birth, months, f){
  return months.map((m, i) => {
    const d = addD(addM(birth, m), 2);
    const j = (k) => Math.sin((i + 1) * 1.7 + k) * 0.18;
    const r = (v, s) => Math.round(v / s) * s;
    return {data: iso(d), peso: r(REF.peso.med(m) + (f[0] + j(1)) * REF.peso.sp(m), .1), altura: r(REF.altura.med(m) + (f[1] + j(2)) * REF.altura.sp(m), .5), pc: r(REF.pc.med(m) + (f[2] + j(3)) * REF.pc.sp(m), .5)};
  });
}

/* =========================================================
   GRÁFICOS (SVG desenhado em JS)
   ========================================================= */
function growthSVG(p, metric, opt = {}){
  const R = REF[metric], [c1, c2, , cd] = COLOR[R.cor];
  const W = 340, H = 236, L = 36, Rt = 14, T = 14, B = 30;
  const am = ageM(p.nasc);
  const maxX = am <= 10 ? 12 : am <= 22 ? 24 : 60;
  const pts = p.medidas.filter(x => x[metric] != null).map(x => ({m: ageM(p.nasc, x.data), v: x[metric], novo: !!x.pub && S.lastPub && x.pub === S.lastPub.pubId, d: x.data})).filter(x => x.m <= maxX + .5);
  const lo = m => R.med(m) - 1.8 * R.sp(m), hi = m => R.med(m) + 1.8 * R.sp(m);
  let ymin = Math.min(lo(0), ...pts.map(x => x.v)), ymax = Math.max(hi(maxX), ...pts.map(x => x.v));
  const step = maxX === 60 && metric === 'peso' ? 4 : R.step;
  ymin = Math.floor(ymin / step) * step; ymax = Math.ceil(ymax / step) * step;
  const X = m => L + (m / maxX) * (W - L - Rt), Y = v => T + (1 - (v - ymin) / (ymax - ymin)) * (H - T - B);
  const N = 40, xs = Array.from({length: N + 1}, (_, i) => i * maxX / N);
  const line = f => xs.map(m => X(m).toFixed(1) + ',' + Y(f(m)).toFixed(1)).join(' ');
  const band = 'M' + xs.map(m => X(m).toFixed(1) + ',' + Y(hi(m)).toFixed(1)).join(' L') + ' L' + xs.slice().reverse().map(m => X(m).toFixed(1) + ',' + Y(lo(m)).toFixed(1)).join(' L') + 'Z';
  let g = '';
  for (let v = ymin; v <= ymax + 1e-6; v += step) g += `<line x1="${L}" x2="${W - Rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E8ECF2"/><text x="${L - 8}" y="${Y(v) + 3.5}" text-anchor="end">${v}</text>`;
  const xstep = maxX === 12 ? 3 : maxX === 24 ? 6 : 12;
  for (let m = 0; m <= maxX; m += xstep) g += `<text x="${X(m)}" y="${H - 10}" text-anchor="middle">${maxX === 60 ? (m / 12) + (m ? 'a' : '') : m}</text>`;
  const path = pts.map(x => X(x.m).toFixed(1) + ',' + Y(x.v).toFixed(1)).join(' ');
  const dots = pts.map((x, i) => {
    const last = i === pts.length - 1;
    return (x.novo ? `<circle class="ping" cx="${X(x.m)}" cy="${Y(x.v)}" r="6" fill="${'#8182B8'}"/>` : '') +
      `<circle cx="${X(x.m)}" cy="${Y(x.v)}" r="${last ? 6 : 4.2}" fill="${last ? '#4E548E' : '#fff'}" stroke="#4E548E" stroke-width="2.2"><title>${dm(x.d)}: ${fmt(x.v, R.dec)} ${R.un}</title></circle>`;
  }).join('');
  const anim = opt.animate !== false;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico ilustrativo de ${R.nome.toLowerCase()} por idade, com faixa de referência ilustrativa e ${pts.length} medidas da criança">
    <g font-size="10" fill="#5A6479" font-family="inherit">${g}</g>
    <path d="${band}" fill="${c2}" opacity=".35"/>
    <polyline points="${line(lo)}" fill="none" stroke="${c1}" stroke-width="1.2" stroke-dasharray="3 4" opacity=".9"/>
    <polyline points="${line(hi)}" fill="none" stroke="${c1}" stroke-width="1.2" stroke-dasharray="3 4" opacity=".9"/>
    <polyline points="${line(R.med)}" fill="none" stroke="${c1}" stroke-width="2"/>
    <polyline class="${anim ? 'draw' : ''}" pathLength="1" points="${path}" fill="none" stroke="#4E548E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${W - Rt}" y="${H - 10}" text-anchor="end" font-size="9" fill="#8A93A6" dx="0" dy="-12">${maxX === 60 ? 'anos' : 'meses'}</text>
  </svg>`;
}
function sparkSVG(p, metric){
  const R = REF[metric], [c1, c2] = COLOR[R.cor];
  const pts = p.medidas.slice(-6).map(x => x[metric]).filter(v => v != null);
  if (pts.length < 2) return '';
  const mn = Math.min(...pts), mx = Math.max(...pts), W = 160, H = 46;
  const xy = pts.map((v, i) => [i * W / (pts.length - 1), H - 6 - (v - mn) / ((mx - mn) || 1) * (H - 16)]);
  const d = 'M' + xy.map(a => a.map(n => n.toFixed(1)).join(',')).join(' L');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W},${H} L0,${H}Z" fill="${c2}" opacity=".55"/><path d="${d}" fill="none" stroke="${c1}" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function setupPin(p){
  const inp = $('#pinIn'), boxes = $$('.pin-box'), go1 = $('#pinGo');
  const upd = () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 6);
    const n = inp.value.length;
    boxes.forEach((b, i) => { b.classList.toggle('on', i < n); b.classList.toggle('cur', i === n && document.activeElement === inp); });
    go1.disabled = n !== 6;
    if (n === 6) setTimeout(() => { if (inp.value.length === 6) pinOk(p); }, 280);
  };
  inp.addEventListener('input', upd); inp.addEventListener('focus', upd); inp.addEventListener('blur', upd);
  setTimeout(() => inp.focus({preventScroll:true}), 350);
}

function fConsultas(p){
  const fut = S.ag.filter(a => a.pid === p.id && daysUntil(a.data) >= 0).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  const groups = {};
  p.pubs.forEach(x => { const d = new Date(x.data); const k = MESES[d.getMonth()] + ' de ' + d.getFullYear(); (groups[k] = groups[k] || []).push(x); });
  const conf = fut.map(a => { const d = parseYmd(a.data); return `<div class="ag-conf">
      <div class="top"><span class="badge b-ok">${ic('check','s')} Agendamento confirmado</span><span class="cd ${daysUntil(a.data) <= 1 ? 'soon' : ''}">${countdown(daysUntil(a.data))}</span></div>

      <div class="sec-h" style="margin-bottom:0"><h2>Histórico</h2></div>
      ${Object.keys(groups).length ? Object.entries(groups).map(([k, xs]) => `<div class="hist-m">${k}</div><div class="stagger" style="display:flex;flex-direction:column;gap:10px">${xs.map(x => `<article class="hist">

          ${x.mats.length ? `<a class="hist-link" href="#/familia/${p.id}/materiais/${x.id}">${ic('book','s')} ${x.mats.length} ${x.mats.length === 1 ? 'material' : 'materiais'} desta consulta ${ic('chevR','s')}</a>` : ''}
        </article>`).join('')}</div>`).join('')

}

function openRegSheet(p, t, k){
  const item = t === 'vacinas' ? VAC.find(v => v.k === k) : TRIAGEM.find(x => x.k === k);
  const hoje = ymd(new Date());
  const bg = openSheet(`<span class="card-t">${t === 'vacinas' ? 'Marcar vacina' : 'Marcar teste'}</span>
    <h2 id="shT">${esc(item.nome)}</h2>
    <label class="field"><span class="lbl">${t === 'vacinas' ? 'Data da aplicação' : 'Data do teste'}</span><input class="input" type="date" id="shDate" value="${hoje}" max="${hoje}"></label>
    <div class="info" style="padding:10px 12px">${ic('info','s')}<span>O item fica verde na caderneta e a Dra. Larissa vê a marcação no painel.</span></div>
